<app-modal [title]="heading()" (close)="cancel.emit()">
  <div class="form">
    <div class="form__disc">
      @for (d of disciplines; track d.key) {
        <button
          type="button"
          class="form__disc-btn"
          [class.form__disc-btn--active]="discipline() === d.key"
          (click)="discipline.set(d.key)"
        >
          <span class="form__disc-label">{{ d.label }}</span>
        </button>
      }
    </div>

    <label class="form__label">Дистанция, {{ unit() }}</label>
    <input
      class="form__input"
      type="number"
      inputmode="decimal"
      min="0"
      step="any"
      placeholder="0"
      [value]="distance() ?? ''"
      (input)="onDistance($event)"
    />

    <input
      class="form__input"
      placeholder="Название (необязательно)"
      [value]="title()"
      (input)="onTitle($event)"
    />

    <textarea
      class="form__textarea"
      rows="3"
      placeholder="Заметка…"
      [value]="note()"
      (input)="onNote($event)"
    ></textarea>

    <div class="form__actions">
      @if (isEdit()) {
        <button
          type="button"
          class="btn btn--danger form__del"
          (click)="remove.emit()"
        >
          Удалить
        </button>
      }
      <button type="button" class="btn btn--primary" (click)="onSave()">
        Сохранить
      </button>
    </div>
  </div>
</app-modal>
