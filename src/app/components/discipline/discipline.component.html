@if (totals().count === 0) {
  <div class="discipline__empty">
    Пока нет тренировок по этой дисциплине.<br />
    Они появятся здесь после импорта соответствующих активностей.
  </div>
} @else {
  <div class="discipline">
    <div class="discipline__cards">
      <app-metric-card label="Тренировок" [value]="totals().count.toString()" />
      <app-metric-card label="Дистанция" [value]="distanceText()" />
      <app-metric-card label="Время" [value]="durationText()" />
    </div>

    @if (form(); as f) {
      <div class="discipline__cards">
        <app-metric-card
          label="Фитнес · CTL"
          [value]="round(f.ctl)"
          accent="var(--accent)"
          hint="Хроническая нагрузка за ~42 дня — накопленный уровень формы. Растёт медленно; устойчивый рост означает прогресс."
        />
        <app-metric-card
          label="Усталость · ATL"
          [value]="round(f.atl)"
          accent="var(--fatigue)"
          hint="Острая нагрузка за ~7 дней — свежая усталость. Быстро реагирует на последние тренировки."
        />
        <app-metric-card
          label="Форма · TSB"
          [value]="round(f.tsb)"
          [accent]="tsb()!.color"
          [sub]="tsb()!.label"
          hint="Баланс формы = CTL − ATL. Плюс — свежесть, минус — накопленная усталость."
        />
      </div>
    }

    <h2 class="discipline__heading">Динамика формы</h2>
    <app-fitness-chart [series]="series()" />

    <h2 class="discipline__heading">Все тренировки</h2>
    <app-activity-list [activities]="activities()" [showEmoji]="false" />
  </div>
}
