<div class="app">
  <header class="app__header">
    <div class="app__brand">◤ Ironman Tracker</div>
    <div class="app__actions">
      <button
        type="button"
        class="app__act"
        aria-label="Открыть меню"
        (click)="menuOpen.set(true)"
      >
        ☰ Меню
      </button>
      <label class="app__act app__act--accent">
        <input type="file" accept=".csv" hidden (change)="onFile($event)" />
        ⇪ Импорт
      </label>
    </div>
  </header>

  <nav class="nav">
    @for (t of tabs; track t.path) {
      <button
        class="nav__i"
        [routerLink]="t.path"
        routerLinkActive="nav__i--active"
      >
        {{ t.label }}@if (t.count) {<sup class="nav__count">{{ t.count() }}</sup>}
      </button>
    }
  </nav>

  @if (service.hasData()) {
    <app-hud-strip class="app__hud" />
  }

  <div class="screenbar">
    <span class="screenbar__t">▸ {{ screenLabel() }}</span>
    <span class="screenbar__m">{{ screenContext() }}</span>
  </div>

  <main class="app__content screen">
    <router-outlet />
  </main>

  @if (toast(); as t) {
    <div class="toast">{{ t }}</div>
  }
</div>

@if (menuOpen()) {
  <div class="scrim" (click)="menuOpen.set(false)"></div>
  <aside class="drawer">
    <app-side-menu (close)="menuOpen.set(false)" />
  </aside>
}
