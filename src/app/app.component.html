<div class="app">
  <header class="app__header">
    <div class="app__brand">◤ Ironman Tracker</div>
    <div class="app__actions">
      <button
        type="button"
        class="app__act"
        aria-label="Открыть меню"
        (click)="menuOpen.set(true)"
      >
        ☰ Меню
      </button>
      <label class="app__act app__act--accent">
        <input type="file" accept=".csv" hidden (change)="onFile($event)" />
        ⇪ Импорт
      </label>
    </div>
  </header>

  <nav class="nav">
    @for (t of tabs; track t.key) {
      <button
        class="nav__i"
        [class.nav__i--active]="activeTab() === t.key"
        (click)="activeTab.set(t.key)"
      >
        {{ t.label }}<sup class="nav__count">{{ tabCount(t.key) }}</sup>
      </button>
    }
  </nav>

  @if (service.hasData()) {
    <app-hud-strip class="app__hud" />
  }

  <div class="screenbar">
    <span class="screenbar__t">▸ {{ activeLabel() }}</span>
    <span class="screenbar__m">{{ screenContext() }}</span>
  </div>

  <main class="app__content screen">
    @if (isOverview(activeTab())) {
      <app-overview />
    } @else if (isPlan(activeTab())) {
      <app-plan />
    } @else {
      <app-discipline [discipline]="asDiscipline(activeTab())" />
    }
  </main>

  @if (toast(); as t) {
    <div class="toast">{{ t }}</div>
  }
</div>

@if (menuOpen()) {
  <div class="scrim" (click)="menuOpen.set(false)"></div>
  <aside class="drawer">
    <app-side-menu (close)="menuOpen.set(false)" />
  </aside>
}
